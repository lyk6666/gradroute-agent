[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gradroute-agent"
version = "0.1.0"
description = "Reference-data-grounded graduation and course-registration resolution prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42,<2",
    "fastapi>=0.117,<1",
    "langgraph>=1.2.10,<1.3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.36,<1",
]

[project.scripts]
gradroute-agent-api = "graduation_exception_agent.api.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "live_bedrock: opt-in test that invokes the configured Amazon Bedrock model",
]
